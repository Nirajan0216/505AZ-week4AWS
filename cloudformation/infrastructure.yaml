AWSTemplateFormatVersion: '2010-09-09'
Description: CivicNexus Week 4 - VPC A + VPC B + peering + ALB + private web ASG + RDS primary + cross-VPC read replica

Parameters:
  Environment:
    Type: String
    Default: week4
  VpcACidr:
    Type: String
    Default: 10.0.0.0/16
  VpcBCidr:
    Type: String
    Default: 10.1.0.0/16
  InstanceType:
    Type: String
    Default: t3.micro
  DBUsername:
    Type: String
    Default: civicadmin
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password
  DBName:
    Type: String
    Default: civicnexus

Resources:
  # ================= VPC A =================
  VpcA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcACidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "civicnexus-vpc-a-${Environment}" }]

  IgwA:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "civicnexus-igw-a-${Environment}" }]

  IgwAAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcA
      InternetGatewayId: !Ref IgwA

  APublic1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: civicnexus-a-public-1 }]

  APublic2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: civicnexus-a-public-2 }]

  AWeb1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-a-web-1 }]

  AWeb2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-a-web-2 }]

  ADB1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-a-db-1 }]

  ADB2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-a-db-2 }]

  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: IgwAAttach
    Properties: { Domain: vpc }

  NatEip2:
    Type: AWS::EC2::EIP
    DependsOn: IgwAAttach
    Properties: { Domain: vpc }

  NatGw1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref APublic1

  NatGw2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref APublic2

  RtAPublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags: [{ Key: Name, Value: civicnexus-a-rt-public }]

  RtAPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAAttach
    Properties:
      RouteTableId: !Ref RtAPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IgwA

  RtAPublicAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref APublic1, RouteTableId: !Ref RtAPublic }
  RtAPublicAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref APublic2, RouteTableId: !Ref RtAPublic }

  RtAWeb1:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcA, Tags: [{ Key: Name, Value: civicnexus-a-rt-web-1 }] }
  RtAWeb2:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcA, Tags: [{ Key: Name, Value: civicnexus-a-rt-web-2 }] }

  RtAWeb1Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RtAWeb1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGw1
  RtAWeb2Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RtAWeb2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGw2

  RtAWebAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AWeb1, RouteTableId: !Ref RtAWeb1 }
  RtAWebAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AWeb2, RouteTableId: !Ref RtAWeb2 }

  RtADB1:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcA, Tags: [{ Key: Name, Value: civicnexus-a-rt-db-1 }] }
  RtADB2:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcA, Tags: [{ Key: Name, Value: civicnexus-a-rt-db-2 }] }

  RtADBAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ADB1, RouteTableId: !Ref RtADB1 }
  RtADBAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ADB2, RouteTableId: !Ref RtADB2 }

  # ================= VPC B =================
  VpcB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcBCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "civicnexus-vpc-b-${Environment}" }]

  BDB1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcB
      CidrBlock: 10.1.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-b-db-1 }]

  BDB2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcB
      CidrBlock: 10.1.21.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: civicnexus-b-db-2 }]

  RtBDB1:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcB, Tags: [{ Key: Name, Value: civicnexus-b-rt-db-1 }] }
  RtBDB2:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcB, Tags: [{ Key: Name, Value: civicnexus-b-rt-db-2 }] }

  RtBDBAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref BDB1, RouteTableId: !Ref RtBDB1 }
  RtBDBAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref BDB2, RouteTableId: !Ref RtBDB2 }

  # ================= Peering + routing =================
  VpcPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref VpcA
      PeerVpcId: !Ref VpcB
      Tags: [{ Key: Name, Value: !Sub "civicnexus-peer-a-b-${Environment}" }]

  RtAWeb1ToB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtAWeb1, DestinationCidrBlock: !Ref VpcBCidr, VpcPeeringConnectionId: !Ref VpcPeering }
  RtAWeb2ToB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtAWeb2, DestinationCidrBlock: !Ref VpcBCidr, VpcPeeringConnectionId: !Ref VpcPeering }
  RtADB1ToB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtADB1, DestinationCidrBlock: !Ref VpcBCidr, VpcPeeringConnectionId: !Ref VpcPeering }
  RtADB2ToB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtADB2, DestinationCidrBlock: !Ref VpcBCidr, VpcPeeringConnectionId: !Ref VpcPeering }
  RtBDB1ToA:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtBDB1, DestinationCidrBlock: !Ref VpcACidr, VpcPeeringConnectionId: !Ref VpcPeering }
  RtBDB2ToA:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref RtBDB2, DestinationCidrBlock: !Ref VpcACidr, VpcPeeringConnectionId: !Ref VpcPeering }

  # ================= Security groups =================
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: civicnexus-alb-sg
      GroupDescription: Allow HTTP/HTTPS from the internet
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: civicnexus-web-sg
      GroupDescription: Web tier - HTTP from ALB only
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !GetAtt AlbSg.GroupId }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  DbASg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: civicnexus-db-a-sg
      GroupDescription: RDS primary - MySQL only from web tier
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !GetAtt WebSg.GroupId }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  DbBSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: civicnexus-db-b-sg
      GroupDescription: RDS read replica - MySQL from web subnets over peering
      VpcId: !Ref VpcB
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, CidrIp: 10.0.10.0/24 }
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, CidrIp: 10.0.11.0/24 }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  # ================= ALB =================
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "civicnexus-alb-${Environment}"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!GetAtt AlbSg.GroupId]
      Subnets: [!Ref APublic1, !Ref APublic2]

  AlbTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "civicnexus-tg-${Environment}"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcA
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: '200' }
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      IntervalSeconds: 30

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTg

  # ================= Private web ASG =================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "civicnexus-web-${Environment}"
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex: 0
            Groups: [!GetAtt WebSg.GroupId]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd
            systemctl enable --now httpd
            cat > /var/www/html/index.html <<'EOF'
            <!DOCTYPE html>
            <html>
            <head><title>CivicNexus - Week 4</title></head>
            <body style="font-family:sans-serif; text-align:center; padding-top:60px;">
              <h1>CivicNexus Web Tier</h1>
              <p>Private ASG instance behind the ALB.</p>
            </body>
            </html>
            EOF
            AZ=$(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)
            INSTANCE=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            echo "<p>Instance: $INSTANCE | AZ: $AZ</p>" > /var/www/html/health.html

  WebAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: IgwAAttach
    Properties:
      AutoScalingGroupName: !Sub "civicnexus-web-asg-${Environment}"
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      VPCZoneIdentifier: [!Ref AWeb1, !Ref AWeb2]
      TargetGroupARNs: [!Ref AlbTg]
      HealthCheckType: ELB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: civicnexus-web-asg
          PropagateAtLaunch: true

  # ================= RDS primary + cross-VPC read replica =================
  DbSubnetsA:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: civicnexus-db-subnets-a
      DBSubnetGroupDescription: Primary DB subnets in VPC A
      SubnetIds: [!Ref ADB1, !Ref ADB2]

  DbSubnetsB:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: civicnexus-db-subnets-b
      DBSubnetGroupDescription: Replica DB subnets in VPC B
      SubnetIds: [!Ref BDB1, !Ref BDB2]

  DbPrimary:
    Type: AWS::RDS::DBInstance
    DependsOn: VpcPeering
    Properties:
      DBInstanceIdentifier: !Sub "civicnexus-db-primary-${Environment}"
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DbSubnetsA
      VPCSecurityGroups: [!GetAtt DbASg.GroupId]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: true

  DbReplica:
    Type: AWS::RDS::DBInstance
    DependsOn: DbPrimary
    Properties:
      DBInstanceIdentifier: !Sub "civicnexus-db-replica-${Environment}"
      SourceDBInstanceIdentifier: !Ref DbPrimary
      DBInstanceClass: db.t3.micro
      DBSubnetGroupName: !Ref DbSubnetsB
      VPCSecurityGroups: [!GetAtt DbBSg.GroupId]
      PubliclyAccessible: false

Outputs:
  AlbDnsName:
    Description: Public URL of the web app
    Value: !GetAtt Alb.DNSName
  RdsPrimaryEndpoint:
    Description: RDS writer endpoint
    Value: !GetAtt DbPrimary.Endpoint.Address
  RdsReplicaEndpoint:
    Description: RDS read replica endpoint (reachable over peering)
    Value: !GetAtt DbReplica.Endpoint.Address
  VpcAId:
    Value: !Ref VpcA
  VpcBId:
    Value: !Ref VpcB
  PeeringId:
    Value: !Ref VpcPeering
